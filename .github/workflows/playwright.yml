name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Cron tính theo UTC — 08:50 UTC = 15:50 giờ Việt Nam (UTC+7), chạy hằng ngày
    - cron: '55 8 * * *'

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

env:
  # Số luồng song song — hạ xuống 2–3 nếu runner 2 vCPU chạy chập chờn.
  # Sửa đúng dòng này, KHÔNG đụng playwright.config.ts
  WORKERS: 3
  BROWSERS: chrome

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://crm.anhtester.com/authentication/login' }}  
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          # Tài khoản tuỳ chọn — secret thiếu thì TC tương ứng tự skip
          PM_EMAIL: ${{ secrets.PM_EMAIL }}
          PM_PASSWORD: ${{ secrets.PM_PASSWORD }}
          CUSTOMER_EMAIL: ${{ secrets.CUSTOMER_EMAIL }}
          CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
          TC014_EMAIL: ${{ secrets.TC014_EMAIL }}
          TC014_PASSWORD: ${{ secrets.TC014_PASSWORD }}
          # Fallback bắt buộc — biến rỗng thành Number('') = 0, tức tắt timeout
          TIMEOUT: ${{ vars.TIMEOUT || '30000' }}
          HEADLESS: 'true'
        run: npx playwright test

      - name: Sinh Allure report
        if: always()
        # CLI đã nằm trong devDependencies — CI không cài Allure riêng
        run: npm run report:generate

      - name: Sinh Allure report 1 file
        if: always()
        # reports/allure-report-single/index.html — mở bằng double-click sau khi tải artifact
        run: npm run report:single

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: reports/
          retention-days: 14

      # Bản đăng lên GitHub Pages — trang Pages công khai, nên bỏ trace (.zip ghi lại cả giá trị ô Password).
      # Artifact test-reports ở bước trên vẫn giữ đủ trace để debug.
      - name: Bỏ trace khỏi bản đăng GitHub Pages
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: find reports/allure-report -name '*.zip' -delete

      - uses: actions/upload-pages-artifact@v3
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: reports/allure-report

      # Vài KB số liệu cho job notify — tránh phải tải cả artifact test-reports hàng trăm MB
      - uses: actions/upload-artifact@v4
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: allure-summary
          path: |
            reports/allure-report/summary.json
            reports/allure-report/test-results.json
          retention-days: 1

  deploy-report:
    # Chạy cả khi test FAIL — report của lần chạy đỏ mới là report cần xem nhất
    if: always() && needs.test.result != 'cancelled' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify:
    # Chạy sau deploy-report để link report trong tin nhắn đã là bản mới nhất
    if: always() && needs.test.result != 'cancelled' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, deploy-report]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        # Run hỏng trước khi sinh report thì không có artifact — script vẫn báo "không có kết quả test"
        continue-on-error: true
        with:
          name: allure-summary
          path: reports/allure-report

      - name: Gửi kết quả vào group Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ vars.TELEGRAM_THREAD_ID }}
          REPORT_URL: ${{ needs.deploy-report.outputs.page_url }}
          DEPLOY_RESULT: ${{ needs.deploy-report.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/telegram-notify.mjs reports/allure-report
